name: Package VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Package extension
        run: npx vsce package --out masum-galaxy-future-code.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: masum-galaxy-future-code-vsix
          path: masum-galaxy-future-code.vsix
          if-no-files-found: error
