<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <radialGradient id="space"><stop stop-color="#15113a"/><stop offset=".48" stop-color="#050817"/><stop offset="1" stop-color="#01030a"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#fff7c2"/><stop offset=".25" stop-color="#ffcf4d"/><stop offset="1" stop-color="#ff5a00"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter><filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
 <pattern id="stars" width="130" height="110" patternUnits="userSpaceOnUse"><circle cx="13" cy="21" r="1" fill="#bfeaff" opacity=".55"/><circle cx="83" cy="65" r=".7" fill="#fff" opacity=".4"/><circle cx="115" cy="18" r=".8" fill="#9ddcff" opacity=".35"/></pattern>
 <style>
 .scene{opacity:0;animation:cycle 40s infinite ease-in-out}.p{filter:url(#blur)}
 .s1{animation-delay:0s}.s2{animation-delay:5s}.s3{animation-delay:10s}.s4{animation-delay:15s}.s5{animation-delay:20s}.s6{animation-delay:25s}.s7{animation-delay:30s}.s8{animation-delay:35s}
 @keyframes cycle{0%{opacity:0;transform:scale(.96)}2%{opacity:.72;transform:scale(1)}10.5%{opacity:.72}12.5%{opacity:0;transform:scale(1.03)}100%{opacity:0}}
 .orbit{fill:none;stroke:#67e8ff;stroke-opacity:.055;stroke-width:1}.hud{fill:none;stroke:#72f6ff;stroke-opacity:.05;stroke-width:1}
 </style>
</defs>
<rect width="1600" height="900" fill="url(#space)"/><rect width="1600" height="900" fill="url(#stars)" opacity=".8"/>
<ellipse cx="850" cy="430" rx="690" ry="290" fill="#5b21b6" opacity=".07" filter="url(#blur)" transform="rotate(-12 850 430)"/>
<circle cx="1420" cy="130" r="66" fill="url(#sun)" opacity=".18" filter="url(#glow)"/><circle cx="1420" cy="130" r="39" fill="url(#sun)" opacity=".28"/>
<circle cx="180" cy="735" r="34" fill="#d8e6ff" opacity=".14"/><circle cx="194" cy="725" r="34" fill="#020510" opacity=".8"/>
<g opacity=".7"><ellipse class="orbit" cx="800" cy="450" rx="250" ry="95"/><ellipse class="orbit" cx="800" cy="450" rx="410" ry="160"/><ellipse class="orbit" cx="800" cy="450" rx="590" ry="235"/></g>
<g class="scene s1"><circle class="p" cx="1220" cy="510" r="86" fill="#a9a7a2"/><circle cx="1220" cy="510" r="72" fill="#85837e" opacity=".42"/></g>
<g class="scene s2"><circle class="p" cx="1260" cy="470" r="128" fill="#e6a35d"/><circle cx="1260" cy="470" r="105" fill="#c97b45" opacity=".4"/></g>
<g class="scene s3"><circle class="p" cx="1250" cy="500" r="138" fill="#1687d4"/><circle cx="1250" cy="500" r="112" fill="#2ac48b" opacity=".24"/></g>
<g class="scene s4"><circle class="p" cx="1240" cy="500" r="112" fill="#c84f31"/><circle cx="1240" cy="500" r="88" fill="#7e2e22" opacity=".38"/></g>
<g class="scene s5"><circle class="p" cx="1220" cy="485" r="205" fill="#c89567"/><path d="M1040 430 Q1220 485 1400 430M1030 500 Q1220 555 1410 500M1060 555 Q1220 600 1380 555" stroke="#f2d2a2" stroke-width="18" opacity=".18" fill="none"/></g>
<g class="scene s6"><ellipse cx="1220" cy="500" rx="255" ry="55" fill="none" stroke="#d9bd7a" stroke-width="24" opacity=".22" transform="rotate(-10 1220 500)"/><circle class="p" cx="1220" cy="500" r="160" fill="#d6b36c"/></g>
<g class="scene s7"><circle class="p" cx="1240" cy="500" r="145" fill="#79d9df"/><ellipse cx="1240" cy="500" rx="205" ry="40" fill="none" stroke="#a8f2f2" stroke-width="8" opacity=".13" transform="rotate(16 1240 500)"/></g>
<g class="scene s8"><circle class="p" cx="1240" cy="500" r="140" fill="#356ac3"/><circle cx="1240" cy="500" r="112" fill="#284d9d" opacity=".3"/></g>
<path class="hud" d="M35 120V35h85M1480 35h85v85M35 780v85h85M1480 865h85v-85"/><path class="hud" d="M800 25v45M777 48h46M800 830v45M777 852h46"/>
<text x="1540" y="845" text-anchor="end" fill="#78f6ff" opacity=".035" font-family="monospace" font-size="9" letter-spacing="3">MASUM BILLAH // GALAXY SYSTEM</text>
</svg>
